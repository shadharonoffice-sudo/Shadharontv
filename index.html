<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | Shadharon TV</title>

    <meta name="author" content="Shadharon TV Team">
    <link rel="canonical" href="https://shadharon-tv.com" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2185209766718207"
         crossorigin="anonymous"></script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;900&family=Poppins:wght@600;900&display=swap');

        :root {
            --primary: #ff0055;
            --secondary: #00ffcc;
            --bg-color: #03070d;
        }

        /* মাউস কার্সার */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Hind Siliguri', sans-serif;
            overflow-x: hidden;
        }

        .cursor {
            width: 25px;
            height: 25px;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, background 0.2s ease;
            z-index: 9999;
        }

        .cursor.hovered {
            transform: translate(-50%, -50%) scale(1.5);
            background: rgba(0, 255, 204, 0.2);
        }

        /* --- Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: 0.4s;
            background: rgba(3, 7, 13, 0.8);
            backdrop-filter: blur(10px);
        }

        header.scrolled {
            padding: 12px 5%;
            background: rgba(3, 7, 13, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }

        .logo span { color: var(--primary); }

        /* --- Hero Section --- */
        .hero { 
            min-height: 100vh; padding: 220px 5% 80px; 
            display: flex; flex-direction: column; align-items: center;
            background: url("WhatsApp Image 2026-04-25 at 16.27.42.jpeg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            text-align: center;
        }

        .hero-title {
            font-size: 2.8rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
            min-height: 30px;
        }

        .video-box {
            width: 100%;
            max-width: 600px;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .reg-running-box {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--primary);
            padding: 12px 25px;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .btn-main {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(45deg, var(--primary), #8000ff);
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.6);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #010408;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="cursor"></div>

    <header id="header">
        <a href="#" class="logo">Shadharon <span>TV</span></a>
    </header>

    <section class="hero">
        <h1 class="hero-title">গানে গানে সেরা এশিয়া</h1>
        <p class="hero-subtitle"><span id="typed-text"></span></p>

        <div class="video-box">
            <!-- ফেসবুক/ইউটিউব ভিডিও প্লেয়ার -->
            <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1347952573837535%2F&show_text=false&width=476&t=0" width="100%" height="100%" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
        </div>

        <div class="reg-running-box">
            গানে গানে সেরা এশিয়া সিজন ৩-এর অফিশিয়াল অডিশন রেজিস্ট্রেশন চলছে!
        </div>

        <a href="o.html" class="btn-main">এখনই রেজিস্ট্রেশন করুন 🚀</a>
    </section>

    <footer>
        <p>&copy; ২০২৬ Shadharon TV. All Rights Reserved.</p>
    </footer>

    <script>
        // Mouse Cursor Script
        const cursor = document.querySelector(".cursor");
        window.addEventListener("mousemove", (e) => {
            cursor.style.left = e.clientX + "px";
            cursor.style.top = e.clientY + "px";
        });

        const interactive = document.querySelectorAll('a, button');
        interactive.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        // Typing Effect
        const phrases = ["গানের জগতে এক নতুন বিপ্লব...", "নিজেকে প্রমাণের সেরা সুযোগ...", "আজই আপনার অডিশন দিন..."];
        let pIdx = 0, lIdx = 0, isDel = false;
        function type() {
            const curr = phrases[pIdx];
            document.getElementById("typed-text").innerText = curr.substring(0, lIdx);
            if (!isDel && lIdx < curr.length) { lIdx++; setTimeout(type, 100); }
            else if (isDel && lIdx > 0) { lIdx--; setTimeout(type, 50); }
            else { isDel = !isDel; if(!isDel) pIdx = (pIdx + 1) % phrases.length; setTimeout(type, 1000); }
        }
        type();

        // Header Scroll Effect
        window.addEventListener('scroll', () => {
            if(window.scrollY > 50) document.getElementById('header').classList.add('scrolled');
            else document.getElementById('header').classList.remove('scrolled');
        });
    </script>
</body>
</html>
