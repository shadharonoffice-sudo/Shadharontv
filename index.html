<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | সিজন ৩</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Poppins:wght@700&display=swap');
        
        :root { 
            --primary: #ff0055; 
            --secondary: #00ffcc; 
            --glass: rgba(255, 255, 255, 0.05); 
            --bg-color: #0d0d0d;
            --text-color: #fff;
            --border-color: rgba(255, 255, 255, 0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: #000; 
            color: var(--text-color); 
            min-height: 100vh;
            width: 100%;
        }

        /* --- Full Width Main Wrapper --- */
        .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* --- Header Section --- */
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            background: var(--glass);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .header h1 { 
            color: var(--secondary); 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin-bottom: 8px;
        }

        .header p { color: #ccc; font-size: 16px; }

        /* --- Layout Grid (Full Screen / Wide View) --- */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        /* --- Video Section --- */
        .video-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: #050505;
            padding: 25px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-box iframe {
            max-width: 100%;
            border: none;
            border-radius: 12px;
        }

        /* --- Info Section --- */
        .info-box {
            background: var(--glass);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .info-box h3 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 8px;
        }

        .info-box ul {
            list-style: none;
            line-height: 2;
            font-size: 16px;
            color: #ddd;
        }

        .info-box ul li::before {
            content: "🎤 ";
        }

        /* --- Action Button --- */
        .btn-register { 
            display: block;
            width: 100%; 
            padding: 20px; 
            border-radius: 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            background: linear-gradient(45deg, var(--primary), #8000ff); 
            text-decoration: none;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Hind Siliguri', sans-serif;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.6);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .wrapper { padding: 15px 10px; }
            .header h1 { font-size: 1.8rem; }
            .btn-register { font-size: 18px; padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- হেডার -->
        <div class="header">
            <h1>গানে গানে সেরা এশিয়া</h1>
            <p>সিজন ৩ — মেগা রিয়েলিটি শো</p>
        </div>

        <div class="main-layout">
            
            <!-- ভিডিও প্লেয়ার সেকশন -->
            <div class="video-box">
                <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1347952573837535%2F&show_text=false&width=476&t=0" width="500" height="500" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
            </div>

            <!-- ফিচারস ও ইনফো -->
            <div class="info-box">
                <h3>শো ফিচারস:</h3>
                <ul>
                    <li>আন্তর্জাতিক মানের মঞ্চ ও জাজমেন্ট</li>
                    <li>বাংলাদেশ ও প্রবাস থেকে অংশগ্রহণের সুযোগ</li>
                    <li>বিজয়ীদের জন্য আকর্ষণীয় পুরস্কার ও গানের সুযোগ</li>
                </ul>
            </div>

            <!-- রেজিস্ট্রেশন বাটন -->
            <a href="o.html" class="btn-register">এখনই রেজিস্ট্রেশন করুন 🚀</a>

        </div>

    </div>

</body>
</html>
