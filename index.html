<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadharon TV | সাধারণ টিভি - সত্যের সন্ধানে সার্বক্ষণিক</title>
    
    <meta name="description" content="Shadharon TV - সাধারণ টিভি। ব্রেকিং নিউজ, রাজনীতি, বিনোদন, খেলাধুলা ও লাইফস্টাইলের সর্বশেষ আপডেট।">
    <meta name="keywords" content="Shadharon TV, Bangladesh News, Bangla News, সাধারণ টিভি, বাংলা খবর, ব্রেকিং নিউজ">
    <meta name="author" content="Shadharon TV Team">
    <link rel="canonical" href="https://shadharontv.com" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2185209766718207" crossorigin="anonymous"></script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@600;700;900&display=swap');

        :root {
            --primary: #ff0055;
            --primary-hover: #d00045;
            --accent: #00ffcc;
            --bg-dark: #0d0e15;
            --card-bg: #161822;
            --nav-bg: #1a1c29;
            --text-light: #ffffff;
            --text-muted: #a0a5ba;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* --- Header Section --- */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .header-date {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* --- Navigation Menu --- */
        nav {
            background-color: var(--nav-bg);
            padding: 0 5%;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .menu-list::-webkit-scrollbar {
            display: none;
        }

        .menu-list li button {
            background: none;
            border: none;
            display: block;
            padding: 14px 20px;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-list li button:hover,
        .menu-list li button.active {
            background-color: var(--primary);
            color: #fff;
        }

        /* --- Main Layout --- */
        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Ticker Bar */
        .ticker-bar {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .ticker-title {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-right: 15px;
            white-space: nowrap;
        }

        .ticker-content {
            color: #ddd;
            font-size: 15px;
        }

        .ticker-content a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        /* News Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section-header h2 {
            font-size: 22px;
            color: var(--accent);
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .news-img {
            width: 100%;
            height: 180px;
            background-color: #222;
            object-fit: cover;
        }

        .news-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .news-category {
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .news-title {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
            font-weight: 600;
        }

        .news-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        footer {
            background: var(--card-bg);
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header>
        <a href="index.html" class="logo">Shadharon <span>TV</span></a>
        <div class="header-date">
            <span id="current-date">বুধবার, ২৯ জুলাই ২০২৬</span>
        </div>
    </header>

    <!-- নেভিগেশন মেনু -->
    <nav>
        <ul class="menu-list">
            <li><button class="menu-btn active" onclick="filterCategory('সব', this)">হোম</button></li>
            <li><button class="menu-btn" onclick="filterCategory('জাতীয়', this)">জাতীয়</button></li>
            <li><button class="menu-btn" onclick="filterCategory('আন্তর্জাতিক', this)">আন্তর্জাতিক</button></li>
            <li><button class="menu-btn" onclick="filterCategory('রাজনীতি', this)">রাজনীতি</button></li>
            <li><button class="menu-btn" onclick="filterCategory('বিনোদন', this)">বিনোদন</button></li>
            <li><button class="menu-btn" onclick="filterCategory('খেলাধুলা', this)">খেলাধুলা</button></li>
            <li><button class="menu-btn" onclick="filterCategory('লাইফস্টাইল', this)">লাইফস্টাইল</button></li>
            <li><button class="menu-btn" onclick="filterCategory('প্রযুক্তি', this)">প্রযুক্তি</button></li>
            <li><button class="menu-btn" onclick="filterCategory('বাণিজ্য', this)">বাণিজ্য</button></li>
            <li><button class="menu-btn" onclick="filterCategory('শিক্ষা', this)">শিক্ষা</button></li>
            <li><button class="menu-btn" onclick="filterCategory('মতামত', this)">মতামত</button></li>
        </ul>
    </nav>

    <!-- মূল কন্টেন্ট -->
    <div class="main-container">
        
        <!-- নোটিশ বার (এখানে অডিশনের নোটিশ রাখা আছে) -->
        <div class="ticker-bar">
            <span class="ticker-title">ঘোষণা</span>
            <div class="ticker-content">
                গানে গানে সেরা এশিয়া সিজন ৩-এর অফিশিয়াল অডিশন চলছে! <a href="o.html">এখনই রেজিস্ট্রেশন করুন 🚀</a>
            </div>
        </div>

        <!-- সংবাদ সেকশন -->
        <div class="section-header">
            <h2 id="category-heading">সর্বশেষ সংবাদ</h2>
        </div>

        <div class="news-grid" id="news-container">
            <!-- JavaScript এর মাধ্যমে news.json থেকে সংবাদ অটোমেটিক লোড হবে -->
            <p style="color: var(--text-muted); grid-column: 1/-1;">সংবাদ লোড হচ্ছে...</p>
        </div>

    </div>

    <footer>
        <p>&copy; ২০২৬ Shadharon TV. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        let allNewsData = [];

        // news.json থেকে খবর লোড করার মূল ফাংশন
        async function fetchNews() {
            try {
                const response = await fetch('news.json');
                if (!response.ok) throw new Error("JSON file load failed");
                allNewsData = await response.json();
                renderNews(allNewsData);
            } catch (error) {
                console.error("Error fetching news:", error);
                document.getElementById('news-container').innerHTML = 
                    '<p style="color: #ff0055; grid-column: 1/-1;">সংবাদ লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে পরে চেষ্টা করুন।</p>';
            }
        }

        // স্ক্রিনে সংবাদ দেখানোর ফাংশন
        function renderNews(newsList) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            if (newsList.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">এই ক্যাটাগরিতে কোনো সংবাদ পাওয়া যায়নি।</p>';
                return;
            }

            newsList.forEach(item => {
                const card = document.createElement('a');
                card.href = `News.html?id=${item.id}`;
                card.className = 'news-card';
                card.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/400x250'}" class="news-img" alt="${item.title}">
                    <div class="news-content">
                        <div>
                            <div class="news-category">${item.category || 'সংবাদ'}</div>
                            <div class="news-title">${item.title}</div>
                        </div>
                        <div class="news-date">${item.date || ''}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ক্যাটাগরি ফিল্টার ফাংশন (মেনুতে ক্লিক করলে কাজ করবে)
        function filterCategory(category, btnElement) {
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('category-heading').innerText = category === 'সব' ? 'সর্বশেষ সংবাদ' : category + ' সংবাদ';

            if (category === 'সব') {
                renderNews(allNewsData);
            } else {
                const filtered = allNewsData.filter(item => item.category === category);
                renderNews(filtered);
            }
        }

        // পেজ লোড হলে রান হবে
        window.onload = fetchNews;
    </script>
</body>
</html>
