<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | সিজন ৩</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Poppins:wght@700&display=swap');
        
        :root { 
            --primary: #ff0055; 
            --secondary: #00ffcc; 
            --glass: rgba(255, 255, 255, 0.08); 
            --bg-color: #000;
            --text-color: #fff;
            --border-color: rgba(255, 255, 255, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: radial-gradient(circle at top, #1a1a1a, var(--bg-color)); 
            color: var(--text-color); 
            padding: 40px 15px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Main Content Area (প্রশস্ত করা হয়েছে) --- */
        .container { 
            width: 100%; 
            max-width: 900px; /* ডেস্কটপে আর ছোট দেখাবে না */
            margin: 0 auto;
        }
        
        .main-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            text-align: center;
        }
        
        .header { margin-bottom: 30px; }
        .header h1 { 
            color: var(--secondary); 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin-bottom: 10px;
        }
        .header p { color: #ccc; font-size: 17px; }
        
        /* --- Video Box --- */
        .video-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            background: #000;
            padding: 20px 10px;
            overflow: hidden;
        }

        .video-box iframe {
            max-width: 100%;
            border: none;
            border-radius: 12px;
        }

        /* --- Info Section --- */
        .info-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }

        .info-box h3 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 8px;
        }

        .info-box ul {
            list-style: none;
            line-height: 2;
            font-size: 16px;
            color: #ddd;
        }

        .info-box ul li::before {
            content: "🎤 ";
        }

        /* --- Action Button --- */
        .btn-register { 
            display: inline-block;
            width: 100%; 
            padding: 20px; 
            border-radius: 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            background: linear-gradient(45deg, var(--primary), #8000ff); 
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.6);
            background: linear-gradient(45deg, #ff1a6a, #8e1aff);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .main-card { padding: 20px; }
            .header h1 { font-size: 1.8rem; }
            .btn-register { font-size: 18px; padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <div class="header">
                <h1>গানে গানে সেরা এশিয়া</h1>
                <p>সিজন ৩ — মেগা রিয়েলিটি শো</p>
            </div>

            <!-- মূল টিজার ভিডিও -->
            <div class="video-box">
                <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1347952573837535%2F&show_text=false&width=476&t=0" width="500" height="500" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
            </div>

            <!-- হাইলাইটস / তথ্য -->
            <div class="info-box">
                <h3>শো ফিচারস:</h3>
                <ul>
                    <li>আন্তর্জাতিক মানের মঞ্চ ও জাজমেন্ট</li>
                    <li>বাংলাদেশ ও প্রবাস থেকে অংশগ্রহণের সুযোগ</li>
                    <li>বিজয়ীদের জন্য আকর্ষণীয় পুরস্কার ও গানের সুযোগ</li>
                </ul>
            </div>

            <!-- রেজিস্ট্রেশন পেজে যাওয়ার বাটন -->
            <a href="o.html" class="btn-register">এখনই রেজিস্ট্রেশন করুন 🚀</a>

        </div>
    </div>

</body>
</html>
