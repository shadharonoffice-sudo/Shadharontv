<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | সিজন ৩</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap');
        
        :root { 
            --primary: #ff0055; 
            --secondary: #00ffcc; 
            --bg-dark: #080c14;
            --glass-bg: rgba(18, 25, 40, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: var(--bg-dark) radial-gradient(circle at top, #1a0212, #05080f); 
            color: #fff; 
            padding: 20px 10px;
            min-height: 100vh;
        }

        .main-layout { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            align-items: flex-start; 
        }
        
        /* --- Sidebar Ads --- */
        .sidebar { 
            width: 160px; 
            position: sticky; 
            top: 20px; 
            display: none; 
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            overflow: hidden;
        }
        @media (min-width: 1024px) { .sidebar { display: block; } }

        /* --- Content Area --- */
        .content { flex: 1; max-width: 650px; width: 100%; margin: 0 auto; }
        
        .ad-row { text-align: center; margin-bottom: 20px; overflow: hidden; border-radius: 8px; }
        
        .reg-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 85, 0.1); 
        }

        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px dashed rgba(255, 255, 255, 0.15); padding-bottom: 20px; }
        .header h1 { 
            color: var(--secondary); 
            font-size: 1.8rem; 
            text-transform: uppercase; 
            font-family: 'Hind Siliguri', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        .header p { color: #cbd5e1; font-size: 15px; }
        
        .section-title { 
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.2), transparent); 
            color: #fff; 
            padding: 10px 15px; 
            border-radius: 8px; 
            font-weight: 700; 
            margin: 25px 0 15px; 
            border-left: 4px solid var(--primary); 
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #e2e8f0; font-weight: 500; }
        
        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 12px; 
            color: #fff; 
            font-size: 15px;
            font-family: inherit;
            outline: none; 
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
            background: rgba(0, 255, 204, 0.05);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }

        select option { background: #0f172a; color: #fff; }
        
        .payment-box {
            background: rgba(255, 204, 0, 0.05);
            border: 1px dashed rgba(255, 204, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .payment-box p { color: #ffcc00; font-weight: 700; font-size: 16px; }

        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            color: white; 
            background: linear-gradient(90deg, var(--primary), #8000ff); 
            margin-top: 20px; 
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.6);
        }

        /* Footer Ad Mobile */
        .mobile-footer-ad { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #000; 
            text-align: center; 
            padding: 5px 0; 
            z-index: 999; 
            display: block; 
        }
        @media (min-width: 768px) { .mobile-footer-ad { display: none; } }
    </style>
</head>

                <div class="payment-box">

                <div class="input-group">

                    <select id="node_method">

                <div class="input-group">

                </div>
                
                <div class="input-group">

                    <input type="text" id="node_trx" placeholder="যেমন: BN7A6D5E" required>

                <button type="submit" class="btn">

            </form>
        </div>

        <div class="ad-row" style="margin-top: 20px;">
             <script src="https://www.highperformanceformat.com/e088f6495a85bd83d691c5fc9b24d89e/invoke.js"></script>
        </div>
    </div>

    <!-- Right Sidebar Ad -->

<script>
    document.getElementById('asiaFullForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('node_name').value;
        const wa = document.getElementById('node_whatsapp').value;
        const res = document.getElementById('node_res').value;
        const job = document.getElementById('node_job').value || 'উল্লেখ নেই';
        const dob = document.getElementById('node_dob').value;
        const gender = document.getElementById('node_gender').value;
        const dist = document.getElementById('node_dist').value;
        const vill = document.getElementById('node_vill').value;
        const method = document.getElementById('node_method').value;
        const sender = document.getElementById('node_sender').value;
        const trx = document.getElementById('node_trx').value;

        const finalMsg = `*গানে গানে সেরা সিজন ৩ এশিয়া (রেজিস্ট্রেশন)*%0A%0A` +
                         `👤 *নাম:* ${name}%0A` +
                         `📱 *WhatsApp:* ${wa}%0A` +
                         `🏠 *বসবাস:* ${res}%0A` +
                         `💼 *পেশা:* ${job}%0A` +
                         `📅 *জন্ম তারিখ:* ${dob}%0A` +
                         `🚻 *লিঙ্গ:* ${gender}%0A` +
                         `📍 *জেলা:* ${dist}%0A` +
                         `🏡 *গ্রাম/মহল্লা:* ${vill}%0A%0A` +
                         `💳 *পেমেন্ট মেথড:* ${method}%0A` +
                         `📞 *প্রেরক নাম্বার:* ${sender}%0A` +
                         `🆔 *TrxID:* ${trx}`;

        window.open(`https://wa.me/8801757331663?text=${finalMsg}`, '_blank');
    });
</script>
