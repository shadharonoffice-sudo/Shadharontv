    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #080c14;
            background-image: radial-gradient(circle at top, #2a081e, #05080f);
            color: #ffffff;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .main-layout {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .sidebar {
            width: 160px;
            position: sticky;
            top: 20px;
            display: none;
        }

        @media (min-width: 1024px) {
            .sidebar { display: block; }
        }

        .content {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .ad-row {
            text-align: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .reg-card {
            background: rgba(18, 25, 40, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 15px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .section-title {
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 700;
            margin: 20px 0 15px 0;
            border-left: 4px solid #ff0055;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #e2e8f0;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Hind Siliguri', sans-serif;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        select option {
            background: #0f172a;
            color: #ffffff;
        }

        .payment-box {
            background: rgba(255, 204, 0, 0.08);
            border: 1px dashed #ffcc00;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .payment-box p {
            color: #ffcc00;
            font-weight: 700;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background: linear-gradient(90deg, #ff0055, #8000ff);
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(255, 0, 85, 0.4);
            font-family: 'Hind Siliguri', sans-serif;
        }

        .btn:hover {
            opacity: 0.95;
        }

        .mobile-footer-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            text-align: center;
            padding: 5px 0;
            z-index: 999;
            display: block;
        }

        @media (min-width: 768px) {
            .mobile-footer-ad { display: none; }
        }

</head>

                    <input type="text" id="node_dist" placeholder="আপনার জেলা" required>

                <div class="input-group">

                <div class="input-group">

<script>
    document.getElementById('asiaFullForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('node_name').value;
        const wa = document.getElementById('node_whatsapp').value;
        const res = document.getElementById('node_res').value;
        const job = document.getElementById('node_job').value || 'উল্লেখ নেই';
        const dob = document.getElementById('node_dob').value;
        const gender = document.getElementById('node_gender').value;
        const dist = document.getElementById('node_dist').value;
        const vill = document.getElementById('node_vill').value;
        const method = document.getElementById('node_method').value;
        const sender = document.getElementById('node_sender').value;
        const trx = document.getElementById('node_trx').value;

        const finalMsg = `*গানে গানে সেরা সিজন ৩ এশিয়া (রেজিস্ট্রেশন)*%0A%0A` +
                         `👤 *নাম:* ${name}%0A` +
                         `📱 *WhatsApp:* ${wa}%0A` +
                         `🏠 *বসবাস:* ${res}%0A` +
                         `💼 *পেশা:* ${job}%0A` +
                         `📅 *জন্ম তারিখ:* ${dob}%0A` +
                         `🚻 *লিঙ্গ:* ${gender}%0A` +
                         `📍 *জেলা:* ${dist}%0A` +
                         `🏡 *গ্রাম/মহল্লা:* ${vill}%0A%0A` +
                         `💳 *পেমেন্ট মেথড:* ${method}%0A` +
                         `📞 *প্রেরক নাম্বার:* ${sender}%0A` +
                         `🆔 *TrxID:* ${trx}`;

        window.open(`https://wa.me/8801757331663?text=${finalMsg}`, '_blank');
    });
</script>
