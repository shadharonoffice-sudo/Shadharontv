<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | সিজন ৩ - রেজিস্ট্রেশন</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Poppins:wght@700&display=swap');
        
        :root { 
            --primary: #ff0055; 
            --secondary: #00ffcc; 
            --glass: rgba(255, 255, 255, 0.08); 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: radial-gradient(circle at top, #1a1a1a, #000); 
            color: #fff; 
            padding: 10px; 
            min-height: 100vh;
        }

        .main-layout { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            max-width: 1300px; 
            margin: 0 auto; 
            align-items: flex-start; 
        }
        
        /* --- Sidebar Ads --- */
        .sidebar { width: 160px; position: sticky; top: 10px; display: none; }
        @media (min-width: 1024px) { .sidebar { display: block; } }

        /* --- Content Area --- */
        .content { flex: 1; max-width: 600px; width: 100%; margin-bottom: 60px; }
        
        .ad-row { text-align: center; margin-bottom: 15px; overflow: hidden; }
        
        .reg-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
        }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--secondary); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .section-title { 
            background: rgba(255, 0, 85, 0.15); 
            color: var(--primary); 
            padding: 10px 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            margin: 20px 0 12px; 
            border-left: 5px solid var(--primary); 
        }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            background: rgba(255,255,255,0.06); 
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 10px; 
            color: white; 
            outline: none; 
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
        }

        select option { background: #1a1a1a; color: #fff; }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            background: linear-gradient(45deg, var(--primary), #8000ff); 
            margin-top: 20px; 
            box-shadow: 0 10px 25px rgba(255,0,85,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255,0,85,0.5);
        }

        /* Footer Ad Mobile */
        .mobile-footer-ad { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #000; 
            text-align: center; 
            padding: 5px 0; 
            z-index: 999; 
            display: block; 
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        @media (min-width: 768px) { .mobile-footer-ad { display: none; } }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- Left Sidebar Ad -->
    <div class="sidebar">
        <script type="text/javascript">
            atOptions = { 'key' : '3c5f9f51b2c86015b0e375d754c8ed06', 'format' : 'iframe', 'height' : 600, 'width' : 160, 'params' : {} };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/3c5f9f51b2c86015b0e375d754c8ed06/invoke.js"></script>
    </div>

    <!-- Main Form Content -->
    <div class="content">
        
        <!-- Banner Ad Top -->
        <div class="ad-row">
            <script type="text/javascript">
                atOptions = { 'key' : '94b95297e478e03fe80e051564f09c1c', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/94b95297e478e03fe80e051564f09c1c/invoke.js"></script>
        </div>

        <div class="reg-card">
            <div class="header">
                <h1>গানে গানে সেরা সিজন ৩ এশিয়া</h1>
                <p style="color: #bbb; font-size: 14px; margin-top: 4px;">অফিসিয়াল রেজিস্ট্রেশন ফরম</p>
            </div>

            <form id="asiaFullForm">
                <div class="section-title">ব্যক্তিগত তথ্য</div>
                
                <div class="input-group">
                    <label>পূর্ণ নাম *</label>
                    <input type="text" id="node_name" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>
                
                <div class="input-group">
                    <label>WhatsApp নাম্বার *</label>
                    <input type="tel" id="node_whatsapp" placeholder="017XXXXXXXX" required>
                </div>
                
                <div class="input-group">
                    <label>বসবাস *</label>
                    <select id="node_res">
                        <option value="বাংলাদেশ">বাংলাদেশ</option>
                        <option value="প্রবাসে">প্রবাসে</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>পেশা</label>
                    <input type="text" id="node_job" placeholder="যেমন: শিক্ষার্থী, শিক্ষক, ইত্যাদি">
                </div>
                
                <div class="input-group">
                    <label>জন্ম তারিখ *</label>
                    <input type="date" id="node_dob" required>
                </div>
                
                <div class="input-group">
                    <label>লিঙ্গ *</label>
                    <select id="node_gender">
                        <option value="পুরুষ">পুরুষ</option>
                        <option value="নারী">নারী</option>
                    </select>
                </div>

                <!-- Mid Native/Square Ad -->
                <div class="ad-row">
                    <script type="text/javascript">
                        atOptions = { 'key' : 'e088f6495a85bd83d691c5fc9b24d89e', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
                    </script>
                    <script type="text/javascript" src="https://www.highperformanceformat.com/e088f6495a85bd83d691c5fc9b24d89e/invoke.js"></script>
                </div>

                <div class="section-title">ঠিকানা</div>
                <div class="input-group">
                    <label>জেলা *</label>
                    <input type="text" id="node_dist" placeholder="আপনার জেলা" required>
                </div>
                
                <div class="input-group">
                    <label>গ্রাম/মহল্লা *</label>
                    <input type="text" id="node_vill" placeholder="গ্রাম বা এলাকার নাম" required>
                </div>

                <div class="section-title">💰 পেমেন্ট ডিটেইলস (১০০০ টাকা)</div>
                <p style="text-align: center; color: #ffd700; font-weight: bold; margin-bottom: 15px; background: rgba(255,215,0,0.1); padding: 8px; border-radius: 8px;">
                    Send Money (Personal): 01757331663
                </p>
                
                <div class="input-group">
                    <label>পেমেন্ট মেথড *</label>
                    <select id="node_method">
                        <option value="বিকাশ">বিকাশ</option>
                        <option value="নগদ">নগদ</option>
                        <option value="রকেট">রকেট</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>পেমেন্টকৃত নাম্বার *</label>
                    <input type="tel" id="node_sender" placeholder="যে নাম্বার থেকে টাকা পাঠিয়েছেন" required>
                </div>
                
                <div class="input-group">
                    <label>TrxID *</label>
                    <input type="text" id="node_trx" placeholder="যেমন: 8N7A6D5E" required>
                </div>

                <button type="submit" class="btn">তথ্য জমা দিন ও গান পাঠান 🚀</button>
            </form>
        </div>

    </div>

    <!-- Right Sidebar Ad -->
    <div class="sidebar">
        <script type="text/javascript">
            atOptions = { 'key' : '134191c03fe43e00a66dce8e11b988b8', 'format' : 'iframe', 'height' : 300, 'width' : 160, 'params' : {} };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/134191c03fe43e00a66dce8e11b988b8/invoke.js"></script>
    </div>
</div>

<!-- Sticky Mobile Footer Ad -->
<div class="mobile-footer-ad">
    <script type="text/javascript">
        atOptions = { 'key' : '94b95297e478e03fe80e051564f09c1c', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    </script>
    <script type="text/javascript" src="https://www.highperformanceformat.com/94b95297e478e03fe80e051564f09c1c/invoke.js"></script>
</div>

<script>
    document.getElementById('asiaFullForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // সব ইনপুট ডেটা গ্রহণ
        const name = document.getElementById('node_name').value.trim();
        const wa = document.getElementById('node_whatsapp').value.trim();
        const res = document.getElementById('node_res').value;
        const job = document.getElementById('node_job').value.trim() || "উল্লেখ নেই";
        const dob = document.getElementById('node_dob').value;
        const gender = document.getElementById('node_gender').value;
        const dist = document.getElementById('node_dist').value.trim();
        const vill = document.getElementById('node_vill').value.trim();
        const method = document.getElementById('node_method').value;
        const sender = document.getElementById('node_sender').value.trim();
        const trx = document.getElementById('node_trx').value.trim();

        // সুন্দর ফরম্যাটে হোয়াটসঅ্যাপ মেসেজ তৈরি
        const finalMsg = `🎵 *গানে গানে সেরা সিজন ৩ এশিয়া - নতুন রেজিস্ট্রেশন* 🎵%0A` +
                         `━━━━━━━━━━━━━━━━━━%0A` +
                         `👤 *নাম:* ${encodeURIComponent(name)}%0A` +
                         `📱 *WhatsApp:* ${encodeURIComponent(wa)}%0A` +
                         `🌍 *বসবাস:* ${encodeURIComponent(res)}%0A` +
                         `💼 *পেশা:* ${encodeURIComponent(job)}%0A` +
                         `🎂 *জন্ম তারিখ:* ${encodeURIComponent(dob)}%0A` +
                         `🚻 *লিঙ্গ:* ${encodeURIComponent(gender)}%0A` +
                         `📍 *ঠিকানা:* ${encodeURIComponent(vill)}, ${encodeURIComponent(dist)}%0A` +
                         `━━━━━━━━━━━━━━━━━━%0A` +
                         `💳 *পেমেন্ট মেথড:* ${encodeURIComponent(method)}%0A` +
                         `📲 *প্রেরক নাম্বার:* ${encodeURIComponent(sender)}%0A` +
                         `🆔 *TrxID:* ${encodeURIComponent(trx)}%0A` +
                         `━━━━━━━━━━━━━━━━━━%0A` +
                         `*দ্রষ্টব্য:* আমি আমার গানের অডিও/ভিডিও নিচে পাঠাচ্ছি।`;

        // হোয়াটসঅ্যাপে রিডাইরেক্ট
        window.open(`https://wa.me/8801757331663?text=${finalMsg}`, '_blank');
    });
</script>

</body>
</html>
