<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গানে গানে সেরা এশিয়া | সিজন ৩ - রেজিস্ট্রেশন</title>
    
    <!-- FontAwesome Font for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #080c14;
            background-image: radial-gradient(circle at top, #2a081e, #05080f);
            color: #ffffff;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .main-layout {
            display: flex;
            justify-content: center;
            max-width: 650px;
            margin: 0 auto;
        }

        .content {
            width: 100%;
        }

        .reg-card {
            background: rgba(18, 25, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 15px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .section-title {
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 700;
            margin: 25px 0 15px 0;
            border-left: 4px solid #ff0055;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #e2e8f0;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Hind Siliguri', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        select option {
            background: #0f172a;
            color: #ffffff;
        }

        .payment-box {
            background: rgba(255, 204, 0, 0.08);
            border: 1px dashed #ffcc00;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .payment-box p {
            color: #ffcc00;
            font-weight: 700;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background: linear-gradient(90deg, #ff0055, #8000ff);
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 0, 85, 0.4);
            font-family: 'Hind Siliguri', sans-serif;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="content">

        <div class="reg-card">
            <div class="header">
                <h1>গানে গানে সেরা সিজন ৩ এশিয়া</h1>
                <p>অফিসিয়াল রেজিস্ট্রেশন ফরম</p>
            </div>

            <form id="asiaFullForm">
                <div class="section-title"><i class="fas fa-user"></i> ব্যক্তিগত তথ্য</div>
                
                <div class="input-group">
                    <label>পূর্ণ নাম *</label>
                    <input type="text" id="node_name" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>
                
                <div class="input-group">
                    <label>WhatsApp নাম্বার *</label>
                    <input type="tel" id="node_whatsapp" placeholder="017XXXXXXXX" required>
                </div>
                
                <div class="input-group">
                    <label>বসবাস *</label>
                    <select id="node_res">
                        <option value="বাংলাদেশ">বাংলাদেশ</option>
                        <option value="প্রবাসে">প্রবাসে</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>পেশা</label>
                    <input type="text" id="node_job" placeholder="যেমন: শিক্ষার্থী, শিক্ষক, ইত্যাদি">
                </div>
                
                <div class="input-group">
                    <label>জন্ম তারিখ *</label>
                    <input type="date" id="node_dob" required>
                </div>
                
                <div class="input-group">
                    <label>লিঙ্গ *</label>
                    <select id="node_gender">
                        <option value="পুরুষ">পুরুষ</option>
                        <option value="নারী">নারী</option>
                        <option value="অন্যান্য">অন্যান্য</option>
                    </select>
                </div>

                <div class="section-title"><i class="fas fa-map-marker-alt"></i> ঠিকানা</div>
                
                <div class="input-group">
                    <label>জেলা *</label>
                    <input type="text" id="node_dist" placeholder="আপনার জেলা" required>
                </div>
                
                <div class="input-group">
                    <label>গ্রাম/মহল্লা *</label>
                    <input type="text" id="node_vill" placeholder="গ্রাম বা এলাকার নাম" required>
                </div>

                <div class="section-title"><i class="fas fa-wallet"></i> 💰 পেমেন্ট ডিটেইলস (১০২০ টাকা)</div>
                
                <div class="payment-box">
                    <p>Send Money (Personal): 01757331663</p>
                </div>

                <div class="input-group">
                    <label>পেমেন্ট মেথড *</label>
                    <select id="node_method">
                        <option value="বিকাশ">বিকাশ</option>
                        <option value="নগদ">নগদ</option>
                        <option value="রকেট">রকেট</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>পেমেন্টকৃত নাম্বার *</label>
                    <input type="tel" id="node_sender" placeholder="যে নাম্বার থেকে টাকা পাঠিয়েছেন" required>
                </div>
                
                <div class="input-group">
                    <label>TrxID *</label>
                    <input type="text" id="node_trx" placeholder="যেমন: BN7A6D5E" required>
                </div>

                <button type="submit" class="btn">
                    <i class="fab fa-whatsapp"></i> তথ্য জমা দিন ও গান পাঠান
                </button>
            </form>
        </div>

    </div>
</div>

<script>
    document.getElementById('asiaFullForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('node_name').value;
        const wa = document.getElementById('node_whatsapp').value;
        const res = document.getElementById('node_res').value;
        const job = document.getElementById('node_job').value || 'উল্লেখ নেই';
        const dob = document.getElementById('node_dob').value;
        const gender = document.getElementById('node_gender').value;
        const dist = document.getElementById('node_dist').value;
        const vill = document.getElementById('node_vill').value;
        const method = document.getElementById('node_method').value;
        const sender = document.getElementById('node_sender').value;
        const trx = document.getElementById('node_trx').value;

        const finalMsg = `*গানে গানে সেরা সিজন ৩ এশিয়া (রেজিস্ট্রেশন)*%0A%0A` +
                         `👤 *নাম:* ${name}%0A` +
                         `📱 *WhatsApp:* ${wa}%0A` +
                         `🏠 *বসবাস:* ${res}%0A` +
                         `💼 *পেশা:* ${job}%0A` +
                         `📅 *জন্ম তারিখ:* ${dob}%0A` +
                         `🚻 *লিঙ্গ:* ${gender}%0A` +
                         `📍 *জেলা:* ${dist}%0A` +
                         `🏡 *গ্রাম/মহল্লা:* ${vill}%0A%0A` +
                         `💳 *পেমেন্ট মেথড:* ${method}%0A` +
                         `📞 *প্রেরক নাম্বার:* ${sender}%0A` +
                         `🆔 *TrxID:* ${trx}`;

        window.open(`https://wa.me/8801757331663?text=${finalMsg}`, '_blank');
    });
</script>

</body>
</html>
