<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADHARON TV | আনলিমিটেড পোস্ট প্যানেল</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ad171c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; color: #ad171c; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">নিউজ পাবলিশ প্যানেল</h2>
    
    <input type="password" id="token" placeholder="GitHub Token দিন">
    <input type="text" id="tit" placeholder="শিরোনাম">
    <textarea id="bod" rows="5" placeholder="খবর বিস্তারিত..."></textarea>
    
    <input type="file" id="fileInp" onchange="uploadImg()">
    <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক (অটো)" readonly>

    <select id="cat">
        <option value="জাতীয়">জাতীয়</option>
        <option value="রাজনীতি">রাজনীতি</option>
        <option value="বিনোদন">বিনোদন</option>
        <option value="খেলাধুলা">খেলাধুলা</option>
    </select>

    <button id="saveBtn" onclick="saveNews()">পাবলিশ করুন</button>
    <div id="status">রেডি</div>
</div>

<script>
    const USER = "shadharonoffice-sudo";
    const REPO = "Shadharontv";
    const PATH = "news.json";
    const IMGBB_KEY = "97d2bb9d4be7954b90bb864839a5fccf";

    // বাংলা এনকোডিং ফিক্স
    function utf8_to_b64(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => {
            return String.fromCharCode('0x' + p1);
        }));
    }

    function b64_to_utf8(str) {
        return decodeURIComponent(Array.prototype.map.call(atob(str), (c) => {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    async function uploadImg() {
        const file = document.getElementById('fileInp').files[0];
        if(!file) return;
        document.getElementById('status').innerText = "ছবি আপলোড হচ্ছে...";
        const fd = new FormData();
        fd.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
        const data = await res.json();
        document.getElementById('imgUrl').value = data.data.url;
        document.getElementById('status').innerText = "ছবি রেডি!";
    }

    async function saveNews() {
        const token = document.getElementById('token').value;
        const title = document.getElementById('tit').value.trim();
        const body = document.getElementById('bod').value.trim();
        const img = document.getElementById('imgUrl').value;
        const category = document.getElementById('cat').value;

        if(!token || !title || !img) return alert("সব তথ্য দিন!");

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        document.getElementById('status').innerText = "লেটেস্ট ডাটা চেক হচ্ছে...";

        try {
            // ১. প্রতিবার সেভ করার আগে লেটেস্ট SHA এবং কন্টেন্ট নিয়ে আসা (ক্যাশ এড়াতে t=Date.now)
            const getRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}?t=${Date.now()}`, {
                headers: { "Authorization": `token ${token}` }
            });
            
            if(!getRes.ok) throw new Error("গিটহাব থেকে ডাটা আনতে পারেনি!");
            
            const gitData = await getRes.json();
            const currentSha = gitData.sha; // এটিই আসল ফিক্স
            let newsList = JSON.parse(b64_to_utf8(gitData.content));

            // ২. নতুন নিউজ যোগ করা
            const newPost = {
                title, body, image: img, category,
                date: new Date().toLocaleDateString('bn-BD')
            };
            newsList.push(newPost);

            // ৩. নতুন SHA সহ আপডেট পাঠানো
            document.getElementById('status').innerText = "পাবলিশ হচ্ছে...";
            const putRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "New Post: " + title,
                    content: utf8_to_b64(JSON.stringify(newsList)),
                    sha: currentSha // লেটেস্ট SHA পাঠিয়ে দেওয়া হলো
                })
            });

            if(putRes.ok) {
                document.getElementById('status').innerText = "সফলভাবে পাবলিশ হয়েছে!";
                // ইনপুট বক্স খালি করা (যাতে বারবার রিফ্রেশ না করা লাগে)
                document.getElementById('tit').value = "";
                document.getElementById('bod').value = "";
                document.getElementById('imgUrl').value = "";
                alert("নিউজ পাবলিশ সফল!");
            } else {
                alert("গিটহাব গ্রহণ করেনি। টোকেন বা পারমিশন চেক করুন।");
            }
        } catch (e) {
            console.error(e);
            alert("ত্রুটি: " + e.message);
        } finally {
            btn.disabled = false;
            document.getElementById('status').innerText = "রেডি";
        }
    }
</script>
</body>
</html>
