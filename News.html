<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadharon TV | সত্যের পথে প্রতিক্ষণ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');
        :root { --primary: #ad171c; --dark: #222; --bg: #f4f4f4; }
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        
        header { background: #fff; padding: 15px 0; border-bottom: 5px solid var(--primary); text-align: center; }
        .logo { font-size: 40px; font-weight: 800; text-decoration: none; color: var(--primary); font-family: serif; }
        .logo span { color: var(--dark); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 2.5fr 1fr; gap: 25px; }

        /* Admin Area */
        #adminArea { display: none; grid-column: span 2; background: #fff; padding: 25px; border: 2px dashed var(--primary); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-post { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* News Cards */
        .news-card { background: #fff; border-bottom: 1px solid #ddd; padding: 20px; display: flex; gap: 20px; cursor: pointer; transition: 0.2s; }
        .news-card:hover { background: #fdfdfd; }
        .news-card img { width: 260px; height: 160px; object-fit: cover; border-radius: 4px; }
        .news-content h2 { margin: 0 0 10px; font-size: 22px; color: var(--dark); line-height: 1.3; }
        .news-content p { font-size: 15px; color: #555; }

        /* Detail View (Modal) */
        #detailView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; }
        .detail-content { background: #fff; max-width: 800px; margin: 20px auto; padding: 30px; border-radius: 8px; position: relative; }
        .close-btn { position: sticky; top: 0; float: right; font-size: 30px; cursor: pointer; color: var(--primary); font-weight: bold; }
        .detail-content img { width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px; }
        .detail-content h1 { font-size: 32px; color: var(--dark); margin-bottom: 15px; }
        .detail-content p { font-size: 18px; color: #333; white-space: pre-wrap; text-align: justify; }

        /* Sidebar */
        .sidebar { background: #fff; padding: 20px; border-radius: 5px; height: fit-content; }
        .side-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; font-weight: bold; cursor: pointer; }

        footer { text-align: center; padding: 40px; background: #fff; margin-top: 40px; border-top: 1px solid #ddd; }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            .news-card { flex-direction: column; }
            .news-card img { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">SHADHARON <span>TV</span></a>
</header>

<div class="container">
    <div id="adminArea">
        <h3 style="text-align:center;">অ্যাডমিন প্যানেল</h3>
        <input type="password" id="tokenInput" placeholder="Secret Token">
        <input type="text" id="title" placeholder="শিরোনাম">
        <textarea id="body" rows="6" placeholder="বিস্তারিত নিউজ..."></textarea>
        <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক">
        <button class="btn-post" onclick="saveToGitHub()">পাবলিশ করুন</button>
    </div>

    <div id="newsFeed">নিউজ লোড হচ্ছে...</div>

    <div class="sidebar">
        <h3>সর্বশেষ সংবাদ</h3>
        <div id="sideFeed"></div>
    </div>
</div>

<!-- Detailed News View -->
<div id="detailView">
    <div class="detail-content">
        <span class="close-btn" onclick="closeDetail()">&times; বন্ধ করুন</span>
        <div id="fullNews"></div>
    </div>
</div>

<footer>
    <p ondblclick="toggleAdmin()">© ২০২৬ <span style="cursor: pointer;">সাধারণ টিভি</span> | সত্যের সন্ধানে প্রতিক্ষণ।</p>
</footer>

<script>
    const GITHUB_USER = "shadharonoffice-sudo";
    const GITHUB_REPO = "Shadharontv";
    const FILE_PATH = "news.json";
    let allNews = [];

    function toggleAdmin() {
        const area = document.getElementById('adminArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
    }

    async function loadNews() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`);
            allNews = await res.json();
            const reversed = [...allNews].reverse();
            
            let html = "";
            let sideHtml = "";

            reversed.forEach((item, index) => {
                html += `
                    <div class="news-card" onclick="showDetail(${allNews.length - 1 - index})">
                        <img src="${item.image || 'https://via.placeholder.com/260x160'}" alt="News">
                        <div class="news-content">
                            <span style="color:red; font-size:12px;">📅 ${item.date}</span>
                            <h2>${item.title}</h2>
                            <p>${item.body.substring(0, 120)}...</p>
                            <b style="color:var(--primary)">বিস্তারিত পড়ুন</b>
                        </div>
                    </div>`;
                
                if(index < 6) sideHtml += `<div class="side-item" onclick="showDetail(${allNews.length - 1 - index})">${item.title}</div>`;
            });

            document.getElementById('newsFeed').innerHTML = html;
            document.getElementById('sideFeed').innerHTML = sideHtml;
        } catch (e) { console.log("Error loading news"); }
    }

    function showDetail(index) {
        const item = allNews[index];
        const detailHtml = `
            <img src="${item.image || ''}">
            <small style="color:red">প্রকাশিত: ${item.date}</small>
            <h1>${item.title}</h1>
            <p>${item.body}</p>
        `;
        document.getElementById('fullNews').innerHTML = detailHtml;
        document.getElementById('detailView').style.display = 'block';
        document.body.style.overflow = 'hidden'; // মেইন পেজ স্ক্রল বন্ধ
    }

    function closeDetail() {
        document.getElementById('detailView').style.display = 'none';
        document.body.style.overflow = 'auto'; // স্ক্রল চালু
    }

    async function saveToGitHub() {
        const token = document.getElementById('tokenInput').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const image = document.getElementById('imgUrl').value;

        if(!token || !title || !body) return alert("তথ্য পূরণ করুন!");

        try {
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            const fileData = await getRes.json();
            let currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

            currentContent.push({ title, body, image, date: new Date().toLocaleString('bn-BD') });

            const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Detailed News Update",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent)))),
                    sha: fileData.sha
                })
            });

            if(updateRes.ok) { alert("পাবলিশ হয়েছে!"); location.reload(); }
        } catch (err) { alert("Error: " + err.message); }
    }

    loadNews();
</script>

</body>
</html>
