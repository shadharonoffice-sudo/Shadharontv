<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADHARON TV | সত্যের সন্ধানে প্রতিক্ষণ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Hind+Siliguri:wght@400;700&display=swap');
        
        :root { --primary: #ad171c; --dark-blue: #2c3e50; --light-bg: #fdfdfd; --text-color: #444; }
        
        body { font-family: 'Hind Siliguri', 'Arial', sans-serif; margin: 0; background: var(--light-bg); color: var(--text-color); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Top Header Section */
        .top-header { background: #34495e; padding: 15px 0; border-bottom: 1px solid #ddd; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        
        /* Logo Styling */
        .logo-box { background: var(--primary); color: #fff; padding: 8px 18px; font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: bold; border-radius: 5px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo-box span { background: #fff; color: var(--dark-blue); padding: 0 8px; border-radius: 3px; font-size: 28px; }

        .header-ad { width: 468px; height: 60px; background: #eee; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; }

        /* Navigation Bar */
        nav { background: #2c3e50; border-bottom: 3px solid var(--primary); sticky: top; top: 0; z-index: 1000; }
        .nav-list { display: flex; list-style: none; margin: 0; padding: 0; overflow-x: auto; white-space: nowrap; }
        .nav-list a { color: #fff; text-decoration: none; padding: 14px 20px; display: block; font-weight: bold; font-size: 15px; transition: 0.3s; }
        .nav-list a:hover { background: var(--primary); }

        /* Main Content Grid */
        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 30px; margin-top: 30px; }
        
        /* News Feed */
        .news-feed { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .post-card { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 4px; transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .post-title { font-size: 20px; color: #222; margin: 10px 0; font-weight: 700; line-height: 1.3; }
        .post-thumb { width: 100%; height: 200px; object-fit: cover; border-radius: 2px; }
        .post-excerpt { font-size: 14px; color: #666; margin-bottom: 15px; height: 65px; overflow: hidden; }
        .read-more { background: #34495e; color: #fff; padding: 6px 12px; text-decoration: none; font-size: 13px; float: right; border-radius: 2px; }

        /* Sidebar */
        .sidebar-box { background: #34495e; color: #fff; padding: 15px; margin-bottom: 25px; border-radius: 4px; }
        .sidebar-title { font-family: 'Oswald', sans-serif; font-size: 22px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 15px; }
        .search-container { display: flex; }
        .search-input { flex: 1; padding: 10px; border: none; border-radius: 2px 0 0 2px; }
        .search-btn { background: var(--primary); color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; border-radius: 0 2px 2px 0; }
        
        .side-post { display: flex; gap: 10px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .side-post img { width: 80px; height: 55px; object-fit: cover; border: 1px solid #fff; border-radius: 2px; }
        .side-post-title { font-size: 14px; color: #add8e6; text-decoration: none; line-height: 1.4; font-weight: 500; }

        /* Footer */
        footer { background: #2c3e50; color: #fff; padding: 40px 0 20px; margin-top: 50px; border-top: 5px solid var(--primary); }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; font-size: 14px; }
        .footer-links a { color: #ccc; text-decoration: none; }
        .footer-links a:hover { color: #fff; }

        /* Admin & Modal */
        #adminPanel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.4); width: 95%; max-width: 450px; z-index: 9999; padding: 20px; border-top: 6px solid var(--primary); }
        #adminPanel input, #adminPanel textarea, #adminPanel select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; overflow-y: auto; padding-top: 60px; }
        .close-btn { position: fixed; top: 15px; right: 20px; background: var(--primary); color: #fff; padding: 8px 18px; cursor: pointer; border: none; font-weight: bold; border-radius: 4px; }

        @media (max-width: 850px) {
            .main-layout { grid-template-columns: 1fr; }
            .header-content { justify-content: center; gap: 15px; }
            .news-feed { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="top-header">
    <div class="container header-content">
        <a href="/" class="logo-box">SHADHARON <span>TV</span></a>
        <div class="header-ad">468x60 Advertisement Area</div>
    </div>
</div>

<nav>
    <div class="container">
        <div class="nav-list">
            <a href="#">Home</a>
            <a href="#">জাতীয়</a>
            <a href="#">রাজনীতি</a>
            <a href="#">আন্তর্জাতিক</a>
            <a href="#">খেলাধুলা</a>
            <a href="#">বিনোদেন</a>
            <a href="#">Contact</a>
        </div>
    </div>
</nav>

<div class="container main-layout">
    <main id="newsGrid" class="news-feed">নিউজ লোড হচ্ছে...</main>
    <aside>
        <div class="sidebar-box">
            <div class="sidebar-title">অনুসন্ধান করুন</div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="খুঁজুন...">
                <button class="search-btn">Search</button>
            </div>
        </div>
        <div class="sidebar-box">
            <div class="sidebar-title">জনপ্রিয় সংবাদ</div>
            <div id="popularSection"></div>
        </div>
    </aside>
</div>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="#">আমাদের সম্পর্কে</a> | <a href="#">যোগাযোগ</a> | <a href="#">গোপনীয়তার নীতি</a> | <a href="#">বিজ্ঞাপন</a>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <div style="text-align: center; font-size: 14px; color: #bbb;">
            © 2026 <b>SHADHARON TV</b> — All rights reserved.
        </div>
    </div>
</footer>

<div id="adminPanel">
    <h3 style="text-align:center; margin-top:0;">অ্যাডমিন প্যানেল ⚙️</h3>
    <input type="password" id="token" placeholder="GitHub Token">
    <input type="text" id="tit" placeholder="সংবাদের শিরোনাম">
    <textarea id="bod" rows="5" placeholder="সংবাদ বিস্তারিত..."></textarea>
    <input type="file" accept="image/*" id="fileInput" onchange="uploadImage(this)">
    <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক (অটো)" readonly>
    <select id="cat">
        <option value="জাতীয়">জাতীয়</option>
        <option value="রাজনীতি">রাজনীতি</option>
        <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
        <option value="খেলাধুলা">খেলাধুলা</option>
    </select>
    <button id="pubBtn" onclick="save()" style="background:#28a745; color:#fff; border:none; padding:12px; width:100%; cursor:pointer; font-weight:bold; border-radius:4px;">পাবলিশ করুন</button>
    <p onclick="closeAdmin()" style="text-align:center; color:red; cursor:pointer; margin-top:15px; font-size:14px;">বন্ধ করুন</p>
</div>

<div id="modal">
    <button class="close-btn" onclick="closeModal()">ফিরে যান</button>
    <div id="fullNewsContent" class="container" style="max-width:800px; padding-bottom:50px;"></div>
</div>

<script>
    const USER = "shadharonoffice-sudo";
    const REPO = "Shadharontv";
    const PATH = "news.json";
    const IMGBB_KEY = "97d2bb9d4be7954b90bb864839a5fccf";
    let allNews = [];

    // Admin Access Code: "admin" টাইপ করলে প্যানেল আসবে
    let keys = "";
    document.addEventListener('keydown', (e) => {
        keys += e.key.toLowerCase();
        if(keys.includes("admin")) {
            document.getElementById('adminPanel').style.display = 'block';
            keys = "";
        }
    });

    async function loadNews() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/${PATH}?v=${Date.now()}`);
            allNews = await res.json();
            render();
        } catch (e) { document.getElementById('newsGrid').innerHTML = "নিউজ লোড করতে সমস্যা হচ্ছে। ফাইলটি ঠিক আছে কি না চেক করুন।"; }
    }

    function render() {
        const grid = document.getElementById('newsGrid');
        const popular = document.getElementById('popularSection');
        let news = [...allNews].reverse();
        
        grid.innerHTML = news.map(n => `
            <div class="post-card">
                <img src="${n.image}" class="post-thumb" alt="news">
                <h2 class="post-title">${n.title}</h2>
                <div class="post-excerpt">${n.body.substring(0, 120)}...</div>
                <a href="javascript:void(0)" class="read-more" onclick="view(${allNews.indexOf(n)})">বিস্তারিত পড়ুন</a>
                <div style="clear:both;"></div>
            </div>
        `).join('');

        popular.innerHTML = news.slice(0, 6).map(n => `
            <div class="side-post">
                <img src="${n.image}">
                <a href="javascript:void(0)" class="side-post-title" onclick="view(${allNews.indexOf(n)})">${n.title}</a>
            </div>
        `).join('');
    }

    function view(idx) {
        const n = allNews[idx];
        document.getElementById('fullNewsContent').innerHTML = `
            <h1 style="font-size:32px; color:#222; margin-top:20px; line-height:1.3;">${n.title}</h1>
            <p style="color:#777; font-size:14px; border-bottom:1px solid #eee; padding-bottom:10px;">
                বিভাগ: ${n.category} | তারিখ: ${n.date || 'সম্প্রতি'}
            </p>
            <img src="${n.image}" style="width:100%; border-radius:5px; margin:20px 0;">
            <div style="font-size:18px; color:#444; line-height:1.8; white-space:pre-wrap;">${n.body}</div>
            <hr style="margin-top:40px; border:0; border-top:1px solid #eee;">
            <button onclick="deleteNews(${idx})" style="background:#eee; color:red; border:none; padding:8px 15px; cursor:pointer; font-size:13px; border-radius:4px;">অ্যাডমিন: নিউজটি মুছুন</button>
        `;
        document.getElementById('modal').style.display = 'block';
        window.scrollTo(0,0);
    }

    async function uploadImage(input) {
        if (!input.files[0]) return;
        const btn = document.getElementById('pubBtn');
        btn.innerText = "ছবি আপলোড হচ্ছে...";
        btn.disabled = true;
        
        const fd = new FormData();
        fd.append("image", input.files[0]);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            document.getElementById('imgUrl').value = data.data.url;
            btn.innerText = "পাবলিশ করুন";
            btn.disabled = false;
        } catch(e) { alert("ছবি আপলোডে সমস্যা হয়েছে!"); btn.innerText = "পাবলিশ করুন"; btn.disabled = false; }
    }

    async function save() {
        const token = document.getElementById('token').value;
        const title = document.getElementById('tit').value;
        const body = document.getElementById('bod').value;
        const img = document.getElementById('imgUrl').value;
        const cat = document.getElementById('cat').value;

        if(!token || !title || !img) return alert("সব তথ্য পূরণ করুন!");

        const nObj = { title, body, image: img, category: cat, date: new Date().toLocaleDateString('bn-BD') };

        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            const git = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(git.content)))); // UTF-8 Fix
            content.push(nObj);

            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(content)))); // UTF-8 Fix
            
            await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${token}` },
                body: JSON.stringify({ message: "Update News", content: updatedContent, sha: git.sha })
            });
            location.reload();
        } catch(e) { alert("পাবলিশ ব্যর্থ! টোকেন চেক করুন।"); }
    }

    async function deleteNews(idx) {
        const t = prompt("নিরাপত্তা টোকেন দিন:");
        if(!t) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, { headers: { Authorization: `token ${t}` } });
            const git = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(git.content))));
            content.splice(idx, 1);
            await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${t}` },
                body: JSON.stringify({ message: "Delete News", content: btoa(unescape(encodeURIComponent(JSON.stringify(content)))), sha: git.sha })
            });
            location.reload();
        } catch(e) { alert("মুছে ফেলা সম্ভব হয়নি!"); }
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
    loadNews();
</script>
</body>
</html>
