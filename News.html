<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadharon TV | সত্যের পথে প্রতিক্ষণ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');

        :root { --red: #ff3e3e; --dark: #0f172a; }
        
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: #0b0f19; color: #e2e8f0; line-height: 1.6; }
        
        header { background: #111827; padding: 25px 0; text-align: center; border-bottom: 2px solid var(--red); box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 32px; font-weight: 800; text-decoration: none; color: #fff; letter-spacing: 2px; }
        .logo span { color: var(--red); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }

        /* Hidden Admin Panel */
        #adminArea { display: none; background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid var(--red); margin-bottom: 40px; box-shadow: 0 10px 30px rgba(255, 62, 62, 0.2); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 16px; }
        .btn-post { background: var(--red); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 18px; }

        /* News Design - Full Detail View */
        .news-feed { display: flex; flex-direction: column; gap: 30px; }
        .news-card { background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #334155; transition: 0.3s; }
        .news-card:hover { border-color: var(--red); }
        
        .news-card img { width: 100%; height: auto; max-height: 500px; object-fit: cover; display: block; }
        .news-content { padding: 25px; }
        .news-content h2 { margin: 0 0 15px; font-size: 26px; color: #fff; line-height: 1.3; font-weight: 700; }
        .news-content p { font-size: 17px; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 0; }
        .date { font-size: 13px; color: var(--red); font-weight: bold; margin-bottom: 10px; display: block; opacity: 0.8; }

        footer { text-align: center; padding: 60px 0; color: #475569; font-size: 14px; border-top: 1px solid #1e293b; margin-top: 50px; }
        .secret-lock { cursor: pointer; user-select: none; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">SHADHARON <span>TV</span></a>
</header>

<div class="container">
    <!-- Hidden Admin Panel -->
    <div id="adminArea">
        <h3 style="margin-top:0; color: var(--red); text-align: center;">অ্যাডমিন কন্ট্রোল প্যানেল</h3>
        <input type="password" id="tokenInput" placeholder="গোপন টোকেনটি দিন (ghp_...)">
        <input type="text" id="title" placeholder="সংবাদের শিরোনাম">
        <textarea id="body" rows="8" placeholder="বিস্তারিত সংবাদ এখানে লিখুন..."></textarea>
        <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক (গুগল বা অন্য সাইট থেকে কপি করা)">
        <button class="btn-post" onclick="saveToGitHub()">সরাসরি পাবলিশ করুন</button>
    </div>

    <!-- Main Feed -->
    <div id="newsFeed" class="news-feed">নিউজ লোড হচ্ছে...</div>
</div>

<footer>
    <p class="secret-lock" ondblclick="toggleAdmin()">© ২০২৬ <span style="color: #64748b;">সাধারণ টিভি</span> | সত্যের সন্ধানে প্রতিক্ষণ।</p>
</footer>

<script>
    const GITHUB_USER = "shadharonoffice-sudo";
    const GITHUB_REPO = "Shadharontv";
    const FILE_PATH = "news.json";

    function toggleAdmin() {
        const area = document.getElementById('adminArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        if(area.style.display === 'block') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert("অ্যাডমিন প্যানেল ওপেন হয়েছে!");
        }
    }

    async function loadNews() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`);
            const news = await res.json();
            let html = "";
            news.reverse().forEach(item => {
                html += `
                    <article class="news-card">
                        ${item.image ? `<img src="${item.image}" alt="news">` : ''}
                        <div class="news-content">
                            <span class="date">📅 ${item.date}</span>
                            <h2>${item.title}</h2>
                            <p>${item.body}</p>
                        </div>
                    </article>`;
            });
            document.getElementById('newsFeed').innerHTML = html || "<p style='text-align:center;'>কোনো নিউজ পাওয়া যায়নি।</p>";
        } catch (e) {
            document.getElementById('newsFeed').innerHTML = "<p style='text-align:center;'>লোডিং এরর। অনুগ্রহ করে news.json ফাইলটি চেক করুন।</p>";
        }
    }

    async function saveToGitHub() {
        const token = document.getElementById('tokenInput').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const image = document.getElementById('imgUrl').value;

        if(!token) return alert("টোকেন ছাড়া নিউজ পাবলিশ করা যাবে না।");
        if(!title || !body) return alert("শিরোনাম এবং বিস্তারিত নিউজ লিখুন।");

        try {
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            const fileData = await getRes.json();
            const sha = fileData.sha;
            let currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

            const newPost = {
                title, body, image,
                date: new Date().toLocaleString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            };
            currentContent.push(newPost);

            const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "News Update via Web",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent)))),
                    sha: sha
                })
            });

            if(updateRes.ok) {
                alert("নিউজটি সফলভাবে পাবলিশ হয়েছে!");
                location.reload();
            } else {
                alert("টোকেনটি সঠিক নয় অথবা গিটহাব পারমিশন দিচ্ছে না।");
            }
        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    loadNews();
</script>

</body>
</html>
