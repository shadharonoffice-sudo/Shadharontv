<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadharon TV | নিরাপদ নিউজ </title>
    <style>
        :root { --red: #e63946; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f9f9f9; }
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 4px solid var(--red); }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        #adminArea { display: none; background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-post { background: var(--red); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .news-card { background: #fff; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .news-card img { width: 100%; height: auto; }
        .news-content { padding: 20px; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">SHADHARON <span style="color:var(--red)">TV</span></h1>
</header>

<div class="container">
    <button onclick="toggleAdmin()" style="float:right; border:none; background:none; color:#999; cursor:pointer;">Admin Access</button>
    <div style="clear:both;"></div>

    <div id="adminArea">
        <h3>অ্যাডমিন প্যানেল</h3>
        <!-- এখানে টোকেনটি ইনপুট দিতে হবে -->
        <input type="password" id="tokenInput" placeholder="আপনার GitHub টোকেনটি (ghp_...) এখানে দিন">
        <hr>
        <input type="text" id="title" placeholder="সংবাদের শিরোনাম">
        <textarea id="body" rows="5" placeholder="বিস্তারিত সংবাদ..."></textarea>
        <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক">
        <button class="btn-post" onclick="saveToGitHub()">পাবলিশ করুন</button>
    </div>

    <div id="newsFeed">লোড হচ্ছে...</div>
</div>

<script>
    const GITHUB_USER = "shadharonoffice-sudo";
    const GITHUB_REPO = "Shadharontv";
    const FILE_PATH = "news.json";

    function toggleAdmin() {
        const area = document.getElementById('adminArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
    }

    // নিউজ লোড করার ফাংশন (এতে টোকেন লাগে না)
    async function loadNews() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`);
            const news = await res.json();
            let html = "";
            news.reverse().forEach(item => {
                html += `
                    <div class="news-card">
                        ${item.image ? `<img src="${item.image}">` : ''}
                        <div class="news-content">
                            <small>${item.date}</small>
                            <h2>${item.title}</h2>
                            <p style="white-space:pre-wrap;">${item.body}</p>
                        </div>
                    </div>`;
            });
            document.getElementById('newsFeed').innerHTML = html;
        } catch (e) {
            document.getElementById('newsFeed').innerHTML = "নিউজ লোড হচ্ছে না। news.json ফাইলটি চেক করুন।";
        }
    }

    // নিউজ সেভ করার ফাংশন (এখানে টোকেন ইনপুট থেকে নেওয়া হয়)
    async function saveToGitHub() {
        const token = document.getElementById('tokenInput').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const image = document.getElementById('imgUrl').value;

        if(!token) return alert("দয়া করে আপনার GitHub টোকেনটি দিন।");
        if(!title || !body) return alert("শিরোনাম এবং সংবাদ লিখুন।");

        try {
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            const fileData = await getRes.json();
            const sha = fileData.sha;
            let currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

            const newPost = {
                title, body, image,
                date: new Date().toLocaleString('bn-BD')
            };
            currentContent.push(newPost);

            const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "News Update",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent)))),
                    sha: sha
                })
            });

            if(updateRes.ok) {
                alert("নিউজ পাবলিশ হয়েছে!");
                location.reload();
            } else {
                alert("টোকেনটি ভুল। আবার চেষ্টা করুন।");
            }
        } catch (err) {
            alert("সমস্যা হয়েছে: " + err.message);
        }
    }

    loadNews();
</script>

</body>
</html>
