<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাধারণ টিভি | প্রফেশনাল নিউজ পোর্টাল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        
        :root { --primary: #ad171c; --black: #222; --border: #e0e0e0; --bg: #fff; }
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: var(--bg); color: #333; overflow-x: hidden; }

        .container { max-width: 1240px; margin: 0 auto; padding: 0 15px; }

        /* Header Section */
        header { border-bottom: 1px solid var(--border); padding: 15px 0; background: #fff; text-align: center; }
        .logo { font-size: 55px; font-weight: 800; color: var(--primary); text-decoration: none; font-family: 'Times New Roman', serif; }
        
        .nav-bar { background: #fff; border-bottom: 3px solid var(--primary); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-items { display: flex; list-style: none; padding: 0; margin: 0; overflow-x: auto; white-space: nowrap; }
        .nav-items li a { padding: 15px 18px; display: block; text-decoration: none; color: #000; font-weight: 700; font-size: 17px; }
        .nav-items li a:hover { color: var(--primary); }

        /* Breaking News */
        .breaking-bar { background: #f8f9fa; border-bottom: 1px solid var(--border); padding: 8px 0; display: flex; align-items: center; }
        .breaking-label { background: var(--primary); color: #fff; padding: 2px 12px; font-weight: bold; margin-right: 15px; flex-shrink: 0; }

        /* Main Layout Grid */
        .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 30px; margin-top: 25px; }

        /* News Section Styling */
        .lead-news { border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 20px; cursor: pointer; }
        .lead-news img { width: 100%; height: 450px; object-fit: cover; border-radius: 4px; }
        .lead-news h1 { font-size: 38px; margin: 15px 0; line-height: 1.2; color: #000; }

        .secondary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .news-card { display: flex; gap: 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .news-card img { width: 150px; height: 100px; object-fit: cover; border-radius: 3px; }
        .news-card h3 { margin: 0; font-size: 19px; line-height: 1.4; color: #111; }
        .news-card:hover h3 { color: var(--primary); }

        /* Sidebar */
        .sidebar-box { border: 1px solid var(--border); padding: 15px; margin-bottom: 25px; border-radius: 4px; }
        .sidebar-title { font-size: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin-bottom: 15px; }
        .side-item { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; gap: 10px; cursor: pointer; text-decoration: none; color: #333; }
        .side-num { color: #ccc; font-size: 24px; font-weight: bold; }

        /* Admin UI */
        #adminPanel { display: none; background: #fff3f3; border: 2px dashed var(--primary); padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .btn-post { background: var(--primary); color: #fff; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; font-size: 18px; }

        /* Modal Details */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-body { max-width: 800px; margin: 0 auto; position: relative; }
        .close-btn { position: sticky; top: 0; float: right; background: var(--primary); color: #fff; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; z-index: 100; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .secondary-grid { grid-template-columns: 1fr; }
            .lead-news h1 { font-size: 28px; }
            .lead-news img { height: 250px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="#" class="logo">SHADHARON TV</a>
    </div>
</header>

<div class="nav-bar">
    <div class="container">
        <ul class="nav-items">
            <li><a href="#"><i class="fa fa-home"></i></a></li>
            <li><a href="#">জাতীয়</a></li>
            <li><a href="#">রাজনীতি</a></li>
            <li><a href="#">আন্তর্জাতিক</a></li>
            <li><a href="#">খেলাধুলা</a></li>
            <li><a href="#">বিনোদন</a></li>
            <li><a href="#">অর্থনীতি</a></li>
            <li><a href="#">ইসলাম</a></li>
            <li><a href="#">ক্যাম্পাস</a></li>
        </ul>
    </div>
</div>

<div class="breaking-bar">
    <div class="container" style="display: flex; align-items: center; width: 100%;">
        <div class="breaking-label">ব্রেকিং:</div>
        <marquee id="tickerText">সংবাদ লোড হচ্ছে...</marquee>
    </div>
</div>

<div class="container">
    <!-- Admin Box (Type 'admin' to show) -->
    <div id="adminPanel">
        <h3 style="text-align: center;">অ্যাডমিন প্যানেল</h3>
        <input type="password" id="ghToken" placeholder="GitHub Token">
        <input type="text" id="pTitle" placeholder="সংবাদের শিরোনাম">
        <textarea id="pBody" rows="6" placeholder="বিস্তারিত খবর..."></textarea>
        <input type="text" id="pImg" placeholder="ছবির ডিরেক্ট লিঙ্ক">
        <button class="btn-post" onclick="uploadData()">পাবলিশ করুন</button>
    </div>

    <div class="main-grid">
        <!-- News Feed Area -->
        <div class="news-feed">
            <div id="leadArea"></div>
            <div class="secondary-grid" id="secondaryArea"></div>
        </div>

        <!-- Sidebar Area -->
        <aside class="sidebar">
            <div class="sidebar-box">
                <div class="sidebar-title">সর্বশেষ সংবাদ</div>
                <div id="sideArea"></div>
            </div>
        </aside>
    </div>
</div>

<div id="modal">
    <div class="modal-body">
        <span class="close-btn" onclick="closeModal()">বন্ধ করুন</span>
        <div id="modalContent"></div>
    </div>
</div>

<footer style="text-align: center; padding: 60px; background: #f9f9f9; border-top: 1px solid #eee; margin-top: 50px;">
    <p>© ২০২৬ <span ondblclick="toggleAdmin()" style="cursor: pointer;">সাধারণ টিভি</span> | সত্যের সন্ধানে প্রতিক্ষণ</p>
</footer>

<script>
    const USER = "shadharonoffice-sudo";
    const REPO = "Shadharontv";
    const PATH = "news.json";
    let newsList = [];

    function toggleAdmin() {
        const area = document.getElementById('adminPanel');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
    }

    async function loadContent() {
        try {
            const r = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/${PATH}?t=${Date.now()}`);
            newsList = await r.json();
            const rev = [...newsList].reverse();
            
            // 1. Lead News (Most recent)
            const lead = rev[0];
            document.getElementById('leadArea').innerHTML = `
                <div class="lead-news" onclick="viewNews(${newsList.length - 1})">
                    <img src="${lead.image || 'https://via.placeholder.com/800x450'}">
                    <h1>${lead.title}</h1>
                    <p style="color:#666; font-size:17px;">${lead.body.substring(0, 200)}...</p>
                </div>`;

            // 2. Secondary Grid (Next 6 news)
            let secHtml = "";
            let ticker = "";
            rev.slice(1, 9).forEach((item, index) => {
                const realIdx = newsList.length - 2 - index;
                secHtml += `
                    <div class="news-card" onclick="viewNews(${realIdx})">
                        <img src="${item.image || 'https://via.placeholder.com/150x100'}">
                        <h3>${item.title}</h3>
                    </div>`;
                ticker += `${item.title} • `;
            });
            document.getElementById('secondaryArea').innerHTML = secHtml;
            document.getElementById('tickerText').innerText = ticker;

            // 3. Side List
            let sideHtml = "";
            rev.slice(0, 10).forEach((item, index) => {
                const realIdx = newsList.length - 1 - index;
                sideHtml += `
                    <div class="side-item" onclick="viewNews(${realIdx})">
                        <span class="side-num">${index + 1}</span>
                        <div style="font-weight:600;">${item.title}</div>
                    </div>`;
            });
            document.getElementById('sideArea').innerHTML = sideHtml;

        } catch (e) { console.error("Error"); }
    }

    function viewNews(i) {
        const item = newsList[i];
        document.getElementById('modalContent').innerHTML = `
            <h1 style="font-size:36px; margin-bottom:10px;">${item.title}</h1>
            <p style="color:#888;">প্রকাশিত: ${item.date || '২৯ এপ্রিল ২০২৬'}</p>
            <hr>
            <img src="${item.image}" style="width:100%; border-radius:5px; margin:20px 0;">
            <p style="font-size:20px; line-height:1.8; white-space:pre-wrap;">${item.body}</p>
        `;
        document.getElementById('modal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    async function uploadData() {
        const tok = document.getElementById('ghToken').value;
        const tit = document.getElementById('pTitle').value;
        const bod = document.getElementById('pBody').value;
        const img = document.getElementById('pImg').value;
        if(!tok || !tit) return alert("তথ্য দিন!");

        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                headers: { Authorization: `token ${tok}` }
            });
            const data = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            
            const time = new Date().toLocaleString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            content.push({ title: tit, body: bod, image: img, date: time });

            await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${tok}` },
                body: JSON.stringify({
                    message: "New Post",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content)))),
                    sha: data.sha
                })
            });
            alert("নিউজ পাবলিশ হয়েছে!"); location.reload();
        } catch (e) { alert("Error!"); }
    }

    loadContent();
</script>
</body>
</html>
