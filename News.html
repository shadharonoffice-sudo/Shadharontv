<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadharon TV | সত্যের পথে প্রতিক্ষণ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');

        :root { --primary: #ad171c; --dark: #222; --bg: #f4f4f4; }
        
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        
        /* The Daily Campus Style Header */
        header { background: #fff; padding: 15px 0; border-bottom: 5px solid var(--primary); text-align: center; }
        .logo { font-size: 45px; font-weight: 800; text-decoration: none; color: var(--primary); font-family: serif; letter-spacing: -1px; }
        .logo span { color: var(--dark); }

        /* Breaking News Bar */
        .breaking-bar { background: var(--primary); color: #fff; padding: 8px 0; font-size: 14px; overflow: hidden; }
        .ticker { display: flex; white-space: nowrap; animation: move 20s linear infinite; }
        @keyframes move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }

        /* Admin Area */
        #adminArea { display: none; grid-column: span 2; background: #fff; padding: 25px; border-radius: 5px; border: 2px dashed var(--primary); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-post { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 18px; }

        /* News Cards */
        .news-feed { display: flex; flex-direction: column; gap: 20px; }
        .news-card { background: #fff; border-bottom: 1px solid #ddd; padding-bottom: 20px; display: flex; gap: 20px; }
        .news-card img { width: 300px; height: 180px; object-fit: cover; border-radius: 4px; }
        .news-content { flex: 1; }
        .news-content h2 { margin: 0 0 10px; font-size: 24px; color: var(--dark); line-height: 1.3; }
        .news-content h2:hover { color: var(--primary); cursor: pointer; }
        .news-content p { font-size: 16px; color: #555; }
        .date { font-size: 12px; color: #888; font-weight: bold; margin-bottom: 5px; display: block; }

        /* Sidebar */
        .sidebar { background: #fff; padding: 20px; border-radius: 5px; height: fit-content; position: sticky; top: 20px; }
        .sidebar h3 { border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 0; }
        .side-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 15px; font-weight: bold; color: #444; cursor: pointer; }
        .side-item:hover { color: var(--primary); }

        footer { text-align: center; padding: 40px 0; background: #fff; color: #666; margin-top: 40px; border-top: 1px solid #ddd; }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            .news-card { flex-direction: column; }
            .news-card img { width: 100%; }
            #adminArea { grid-column: span 1; }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">SHADHARON <span>TV</span></a>
</header>

<div class="breaking-bar">
    <div class="ticker" id="tickerText">ব্রেকিং নিউজ: সাধারণ টিভিতে আপনাকে স্বাগতম... সত্যের সন্ধানে আমরা আপনার সাথে...</div>
</div>

<div class="container">
    <!-- Admin Panel -->
    <div id="adminArea">
        <h3 style="text-align:center; color: var(--primary);">অ্যাডমিন প্যানেল (Daily Campus Style)</h3>
        <input type="password" id="tokenInput" placeholder="গোপন টোকেন (ghp_...)">
        <input type="text" id="title" placeholder="সংবাদের শিরোনাম">
        <textarea id="body" rows="6" placeholder="বিস্তারিত সংবাদ..."></textarea>
        <input type="text" id="imgUrl" placeholder="ছবির লিঙ্ক (Image URL)">
        <button class="btn-post" onclick="saveToGitHub()">নিউজ পাবলিশ করুন</button>
    </div>

    <!-- Main Content -->
    <div id="newsFeed" class="news-feed">নিউজ লোড হচ্ছে...</div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>সর্বশেষ সংবাদ</h3>
        <div id="sideFeed">লোড হচ্ছে...</div>
        <br>
        <div style="background: #fdf2f2; padding: 15px; border-radius: 5px; border: 1px solid #facdcd;">
            <strong>বিজ্ঞাপন</strong>
            <p style="font-size: 12px; color: #888;">এখানে আপনার বিজ্ঞাপন দিতে পারেন।</p>
        </div>
    </div>
</div>

<footer>
    <p ondblclick="toggleAdmin()">© ২০২৬ <span style="cursor: pointer;">সাধারণ টিভি</span> | সত্যের পথে প্রতিক্ষণ।</p>
</footer>

<script>
    const GITHUB_USER = "shadharonoffice-sudo";
    const GITHUB_REPO = "Shadharontv";
    const FILE_PATH = "news.json";

    function toggleAdmin() {
        const area = document.getElementById('adminArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        if(area.style.display === 'block') window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadNews() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`);
            const news = await res.json();
            let html = "";
            let sideHtml = "";
            let tickerHtml = "ব্রেকিং নিউজ: ";

            const reversedNews = [...news].reverse();

            reversedNews.forEach((item, index) => {
                // Main Feed
                html += `
                    <div class="news-card">
                        <img src="${item.image || 'https://via.placeholder.com/300x180'}" alt="News">
                        <div class="news-content">
                            <span class="date">${item.date}</span>
                            <h2>${item.title}</h2>
                            <p>${item.body.substring(0, 150)}...</p>
                        </div>
                    </div>`;
                
                // Sidebar Feed (Top 5)
                if(index < 5) {
                    sideHtml += `<div class="side-item">${item.title}</div>`;
                }

                // Ticker
                tickerHtml += `${item.title} | `;
            });

            document.getElementById('newsFeed').innerHTML = html;
            document.getElementById('sideFeed').innerHTML = sideHtml;
            document.getElementById('tickerText').innerText = tickerHtml;
        } catch (e) {
            document.getElementById('newsFeed').innerHTML = "নিউজ পাওয়া যায়নি।";
        }
    }

    async function saveToGitHub() {
        const token = document.getElementById('tokenInput').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const image = document.getElementById('imgUrl').value;

        if(!token || !title) return alert("সব তথ্য পূরণ করুন।");

        try {
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            const fileData = await getRes.json();
            const sha = fileData.sha;
            let currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

            const newPost = {
                title, body, image,
                date: new Date().toLocaleString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' })
            };
            currentContent.push(newPost);

            const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Daily Campus Style Update",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent)))),
                    sha: sha
                })
            });

            if(updateRes.ok) {
                alert("পাবলিশ সফল হয়েছে!");
                location.reload();
            } else {
                alert("ত্রুটি হয়েছে। টোকেন চেক করুন।");
            }
        } catch (err) { alert("Error: " + err.message); }
    }

    loadNews();
</script>

</body>
</html>
