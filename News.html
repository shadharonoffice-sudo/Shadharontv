<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADHARON TV 🌎 | অ্যাডমিন কন্ট্রোল</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap');
        :root { --primary: #ad171c; --white: #ffffff; --bg: #f4f6f9; }
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: var(--bg); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        header { background: var(--white); border-bottom: 2px solid var(--primary); padding: 15px 0; text-align: center; }
        .logo { font-size: 35px; font-weight: 800; color: var(--primary); text-decoration: none; }

        /* Admin Controls (Hidden by Default) */
        #adminPanel { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; border-radius: 12px; box-shadow: 0 10px 50px rgba(0,0,0,0.3);
            width: 90%; max-width: 400px; z-index: 9999; padding: 20px; border-top: 5px solid var(--primary);
        }
        .admin-only { display: none; margin-top: 10px; }
        .btn-del { background: #ff4d4d; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-edit { background: #28a745; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* News Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; }
        .card-info { padding: 15px; }

        /* Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; overflow-y: auto; }
        .modal-body { max-width: 700px; margin: 50px auto; padding: 20px; }
        .close { position: fixed; top: 20px; right: 20px; background: red; color: #fff; padding: 10px; cursor: pointer; border-radius: 5px; }

        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button.save { background: var(--primary); color: white; width: 100%; padding: 12px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header><a href="#" class="logo">SHADHARON TV 🌎</a></header>

<div class="container">
    <div id="adminPanel">
        <h3 style="margin-top:0;">অ্যাডমিন প্যানেল</h3>
        <input type="password" id="token" placeholder="GitHub Token দিন">
        <hr>
        <input type="text" id="tit" placeholder="শিরোনাম">
        <textarea id="bod" rows="4" placeholder="বিস্তারিত খবর..."></textarea>
        <input type="text" id="img" placeholder="ছবির লিংক">
        <select id="cat">
            <option value="জাতীয়">জাতীয়</option>
            <option value="রাজনীতি">রাজনীতি</option>
            <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
        </select>
        <input type="hidden" id="editIdx" value="-1">
        <button class="save" onclick="save()">নিউজ সেভ করুন</button>
        <button onclick="closeAdmin()" style="width:100%; margin-top:5px; cursor:pointer;">বন্ধ করুন</button>
    </div>

    <div id="newsGrid" class="grid"></div>
</div>

<div id="modal">
    <div class="close" onclick="closeModal()">বন্ধ করুন</div>
    <div class="modal-body" id="fullNews"></div>
</div>

<script>
    const USER = "shadharonoffice-sudo";
    const REPO = "Shadharontv";
    const PATH = "news.json";
    let allNews = [];

    // 'admin' লিখলে প্যানেল আসবে
    let keys = "";
    document.addEventListener('keydown', (e) => {
        keys += e.key.toLowerCase();
        if(keys.includes("admin")) {
            document.getElementById('adminPanel').style.display = 'block';
            keys = "";
            // অ্যাডমিন প্যানেল খুললে ডিলিট বাটন দেখাবে
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
        }
    });

    async function load() {
        try {
            const r = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/${PATH}?t=${Date.now()}`);
            allNews = await r.json();
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = "";
            
            allNews.slice().reverse().forEach((n, i) => {
                const realIdx = allNews.indexOf(n);
                grid.innerHTML += `
                    <div class="card">
                        <img src="${n.image}" onclick="view(${realIdx})">
                        <div class="card-info">
                            <h3 onclick="view(${realIdx})">${n.title}</h3>
                            <div class="admin-only">
                                <button class="btn-edit" onclick="editNews(${realIdx})">এডিট</button>
                                <button class="btn-del" onclick="delNews(${realIdx})">ডিলিট</button>
                            </div>
                        </div>
                    </div>`;
            });
        } catch(e) { console.error("Load failed"); }
    }

    function view(idx) {
        const n = allNews[idx];
        document.getElementById('fullNews').innerHTML = `
            <h2>${n.title}</h2>
            <small>${n.category} | ${n.date || ''}</small>
            <img src="${n.image}" style="width:100%; margin:20px 0; border-radius:10px;">
            <div style="font-size:18px; line-height:1.6; white-space:pre-wrap;">${n.body}</div>`;
        document.getElementById('modal').style.display = 'block';
    }

    async function save() {
        const t = document.getElementById('token').value;
        if(!t) return alert("টোকেন দিন!");
        
        const editIdx = parseInt(document.getElementById('editIdx').value);
        const newsObj = {
            title: document.getElementById('tit').value,
            body: document.getElementById('bod').value,
            image: document.getElementById('img').value,
            category: document.getElementById('cat').value,
            date: new Date().toLocaleDateString('bn-BD')
        };

        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                headers: { Authorization: `token ${t}` }
            });
            const git = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(git.content))));

            if(editIdx === -1) content.push(newsObj);
            else content[editIdx] = newsObj;

            await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${t}` },
                body: JSON.stringify({
                    message: "Update",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content)))),
                    sha: git.sha
                })
            });
            location.reload();
        } catch(e) { alert("Error! চেক করুন টোকেন সঠিক কি না।"); }
    }

    async function delNews(idx) {
        const t = document.getElementById('token').value;
        if(!t) return alert("টোকেন দিন!");
        if(!confirm("মুছে ফেলবেন?")) return;

        try {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                headers: { Authorization: `token ${t}` }
            });
            const git = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(git.content))));
            content.splice(idx, 1);

            await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`, {
                method: "PUT",
                headers: { Authorization: `token ${t}` },
                body: JSON.stringify({ message: "Delete", content: btoa(unescape(encodeURIComponent(JSON.stringify(content)))), sha: git.sha })
            });
            location.reload();
        } catch(e) { alert("Failed!"); }
    }

    function editNews(idx) {
        const n = allNews[idx];
        document.getElementById('tit').value = n.title;
        document.getElementById('bod').value = n.body;
        document.getElementById('img').value = n.image;
        document.getElementById('cat').value = n.category;
        document.getElementById('editIdx').value = idx;
        window.scrollTo(0,0);
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

    load();
</script>
</body>
</html>
